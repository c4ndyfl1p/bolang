<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BoLang</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="preload">
  <main class="popup">
    <header class="brand">
      <img src="icons/icon48.png" alt="" width="36" height="36" />
      <div>
        <h1 class="wordmark"><span class="hi" lang="hi">बोल</span>Lang</h1>
        <p class="tagline">learn a language while you read</p>
      </div>
    </header>

    <fieldset class="section">
      <legend>I'm learning</legend>
      <div class="languages" id="languages">
        <label class="chip"><input type="radio" name="lang" value="DA" /><span lang="da">Dansk</span></label>
        <label class="chip"><input type="radio" name="lang" value="DE" /><span lang="de">Deutsch</span></label>
        <label class="chip"><input type="radio" name="lang" value="ES" /><span lang="es">Español</span></label>
        <label class="chip"><input type="radio" name="lang" value="FR" /><span lang="fr">Français</span></label>
        <label class="chip"><input type="radio" name="lang" value="IT" /><span lang="it">Italiano</span></label>
        <label class="chip"><input type="radio" name="lang" value="PL" /><span lang="pl">Polski</span></label>
      </div>
    </fieldset>

    <section class="section">
      <h2 class="legend">How many words to swap</h2>
      <div class="amounts">
        <fieldset class="amount" data-key="nounSliderValue">
          <legend><span class="sample noun">nouns</span></legend>
          <div class="segmented">
            <label><input type="radio" name="noun" value="0" /><span>Off</span></label>
            <label><input type="radio" name="noun" value="1" /><span>Some</span></label>
            <label><input type="radio" name="noun" value="2" /><span>Lots</span></label>
          </div>
        </fieldset>
        <fieldset class="amount" data-key="verbSliderValue">
          <legend><span class="sample verb">verbs</span></legend>
          <div class="segmented">
            <label><input type="radio" name="verb" value="0" /><span>Off</span></label>
            <label><input type="radio" name="verb" value="1" /><span>Some</span></label>
            <label><input type="radio" name="verb" value="2" /><span>Lots</span></label>
          </div>
        </fieldset>
        <fieldset class="amount" data-key="prepositionSliderValue">
          <legend><span class="sample preposition">prepositions</span></legend>
          <div class="segmented">
            <label><input type="radio" name="preposition" value="0" /><span>Off</span></label>
            <label><input type="radio" name="preposition" value="1" /><span>Some</span></label>
            <label><input type="radio" name="preposition" value="2" /><span>Lots</span></label>
          </div>
        </fieldset>
      </div>
    </section>

    <button id="translate-btn" class="primary">
      <span class="label">Translate this page</span>
    </button>

    <div id="result" class="result" hidden>
      <div class="stats">
        <div class="stat noun"><strong id="count-nouns">0</strong><span>nouns</span></div>
        <div class="stat verb"><strong id="count-verbs">0</strong><span>verbs</span></div>
        <div class="stat preposition"><strong id="count-prepositions">0</strong><span>prepositions</span></div>
      </div>
      <p class="caption">unique words translated · hover one to peek</p>
    </div>

    <p id="status-text" class="status" role="status"></p>

    <footer class="footer">
      <button id="restore-btn" class="link">Show original text</button>
      <span class="sep" aria-hidden="true">·</span>
      <button id="invite-toggle" class="link" aria-expanded="false" aria-controls="invite-panel">Invite code</button>
    </footer>

    <div id="invite-panel" class="invite" hidden>
      <label for="invite-code">Your invite code</label>
      <div class="invite-row">
        <input id="invite-code" type="text" placeholder="ABCD-EFGH" autocomplete="off" spellcheck="false" maxlength="20" />
        <span id="invite-saved" class="saved" hidden>Saved ✓</span>
      </div>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
