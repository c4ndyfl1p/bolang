<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bolang Translate</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <h2>🌍 Bolang Translate</h2>

    <div class="group">
      <label for="target-language">Target Language</label>
      <select id="target-language">
        <option value="DA">Danish</option>
        <option value="ES">Spanish</option>
        <option value="FR">French</option>
        <option value="DE">German</option>
        <option value="IT">Italian</option>
        <option value="PL">Polish</option>
      </select>
    </div>

    <div class="group">
      <label for="noun-slider"><span class="dot noun"></span>Nouns</label>
      <input type="range" id="noun-slider" min="0" max="2" value="1">
      <div class="ticks"><span>Off</span><span>Some</span><span>Lots</span></div>
    </div>

    <div class="group">
      <label for="verb-slider"><span class="dot verb"></span>Verbs</label>
      <input type="range" id="verb-slider" min="0" max="2" value="1">
      <div class="ticks"><span>Off</span><span>Some</span><span>Lots</span></div>
    </div>

    <div class="group">
      <label for="preposition-slider"><span class="dot preposition"></span>Prepositions</label>
      <input type="range" id="preposition-slider" min="0" max="2" value="1">
      <div class="ticks"><span>Off</span><span>Some</span><span>Lots</span></div>
    </div>

    <div class="actions">
      <button id="translate-btn" class="primary">Translate this page</button>
      <button id="restore-btn" class="secondary">Show original</button>
    </div>
    <p id="status-text" role="status"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
